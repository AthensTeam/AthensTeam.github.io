<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Weather Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Hello! We are RJP! :D</h1>
  <p>This is my first web page. I made it with HTML, CSS and JavaScript.</p>

  <h2>Things we don't like</h2>
  <ul>
    <li>Math</li>
    <li>Math</li>
    <li>and Math</li>
  </ul>

  <div class="weather-box">
    <h2>Weather in Syros now</h2>
    <p id="weather">Loading the weather...</p>
  </div>

  <p class="credit">Weather data by <a href="https://open-meteo.com">Open-Meteo.com</a></p>

  <script>
    fetch("https://www.meteo.gr/cf-en.cfm?city_id=77#google_vignette)
      .then(response => response.json())
      .then(data => {
        document.getElementById("weather").textContent =
          "Temperature: " + data.current.temperature_2m + " °C, Wind: " +
          data.current.wind_speed_10m + " km/h";
      })
      .catch(error => {
        document.getElementById("weather").textContent = "Sorry, the weather is not available right now.";
      });
  </script>

</body>
</html>
